name: Nestly heartbeat

on:
  schedule:
    - cron: '2/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nestly-heartbeat.yml'

permissions: {}

concurrency:
  group: nestly-heartbeat
  cancel-in-progress: false

jobs:
  tick:
    if: github.repository == 'fabioalcantara/nestly' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Run authenticated heartbeat
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from 'node:fs/promises';

          const endpoint = 'https://nestly.bot/api/lifecycle';
          const requestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if (!requestUrl || !requestToken) {
            throw new Error('GitHub OIDC credentials unavailable.');
          }
          const oidcUrl = new URL(requestUrl);
          oidcUrl.searchParams.set('audience', endpoint);
          const oidcResponse = await fetch(oidcUrl, {
            headers: { Authorization: `Bearer ${requestToken}` },
            signal: AbortSignal.timeout(20_000)
          });
          if (!oidcResponse.ok) {
            throw new Error(`OIDC issuance failed (HTTP ${oidcResponse.status}).`);
          }
          const oidc = await oidcResponse.json();
          if (typeof oidc.value !== 'string' || !oidc.value) {
            throw new Error('OIDC response did not contain a token.');
          }
          process.stdout.write(`::add-mask::${oidc.value}\n`);
          // Temporary diagnostics expose validation booleans, never token claims.
          const parts = oidc.value.split('.');
          const header = JSON.parse(Buffer.from(parts[0], 'base64url').toString());
          const claims = JSON.parse(Buffer.from(parts[1], 'base64url').toString());
          const seconds = Math.floor(Date.now() / 1000);
          const checks = {
            algorithm: header.alg === 'RS256', type: header.typ === 'JWT', kidPresent: typeof header.kid === 'string',
            issuer: claims.iss === 'https://token.actions.githubusercontent.com', audience: claims.aud === endpoint,
            repository: claims.repository === 'fabioalcantara/nestly', repositoryId: claims.repository_id === '1386825271',
            ownerId: claims.repository_owner_id === '24461451', ref: claims.ref === 'refs/heads/main',
            workflow: claims.workflow_ref === 'fabioalcantara/nestly/.github/workflows/nestly-heartbeat.yml@refs/heads/main',
            event: ['schedule', 'workflow_dispatch', 'push'].includes(claims.event_name),
            subject: ['repo:fabioalcantara/nestly:ref:refs/heads/main', 'repo:fabioalcantara@24461451/nestly@1386825271:ref:refs/heads/main'].includes(claims.sub),
            expires: typeof claims.exp === 'number' && claims.exp > seconds,
            issued: typeof claims.iat === 'number' && claims.iat <= seconds + 30 && claims.iat >= seconds - 600,
            lifetime: claims.exp - claims.iat <= 600,
            notBefore: typeof claims.nbf !== 'number' || claims.nbf <= seconds + 30
          };
          const jwksResponse = await fetch('https://token.actions.githubusercontent.com/.well-known/jwks', { signal: AbortSignal.timeout(10_000), redirect: 'error' });
          checks.jwksAvailable = jwksResponse.ok;
          if (jwksResponse.ok) {
            const jwks = await jwksResponse.json();
            const jwk = jwks.keys?.find(key => key.kid === header.kid && key.kty === 'RSA' && (!key.alg || key.alg === 'RS256'));
            checks.keyFound = !!jwk;
            if (jwk) {
              const key = await crypto.subtle.importKey('jwk', jwk, { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' }, false, ['verify']);
              checks.signature = await crypto.subtle.verify('RSASSA-PKCS1-v1_5', key, Buffer.from(parts[2], 'base64url'), new TextEncoder().encode(parts[0] + '.' + parts[1]));
            }
          }
          console.log(JSON.stringify({ oidcChecks: checks }));
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${oidc.value}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ action: 'tick' }),
            signal: AbortSignal.timeout(220_000)
          });
          if (!response.ok) {
            // Do not log response bodies: they may contain account diagnostics.
            const body = await response.json().catch(() => ({}));
            console.log(JSON.stringify({ routeAuthMessage: body.error === 'A execução em segundo plano precisa de autenticação própria.' }));
            throw new Error(`Nestly heartbeat failed (HTTP ${response.status}).`);
          }
          const result = await response.json();
          if (result.ok !== true) {
            throw new Error('Nestly did not confirm heartbeat success.');
          }
          const summary = { httpStatus: response.status, ok: true };
          for (const key of ['processed', 'successful', 'failed', 'ownersWithErrors', 'pendingReviews', 'completedReviews', 'sharedProcessed', 'sharedDecisions', 'sharedPending', 'sharedFailed']) {
            if (Number.isSafeInteger(result[key]) && result[key] >= 0) summary[key] = result[key];
          }
          console.log(JSON.stringify(summary));
          if (process.env.GITHUB_STEP_SUMMARY) {
            await appendFile(process.env.GITHUB_STEP_SUMMARY,
              `Nestly heartbeat accepted. HTTP ${summary.httpStatus}.\n\n` +
              'Only aggregate health is shown. This does not assert that every entity was reviewed.\n');
          }
          if (result.modelConfigured === false) {
            throw new Error('The server reports no configured model provider.');
          }
          if (Number.isSafeInteger(result.failed) && result.failed > 0) {
            throw new Error(`Heartbeat completed with ${result.failed} owner error(s); inspect private Nestly health details.`);
          }
          if (Number.isSafeInteger(result.sharedFailed) && result.sharedFailed > 0) {
            throw new Error('Shared Space review failed; inspect private Nestly health details.');
          }
          NODE
